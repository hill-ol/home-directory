name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # CI builds against the committed seed in src/content, with no database
      # on purpose. That keeps the run hermetic: the accessibility suite then
      # measures content that lives in the repo, so editing the live site
      # cannot turn CI red, and no real credentials are needed here.
      #
      # These two exist only because createNeonAuth validates its config at
      # module load, which happens while Next collects page data for
      # /api/auth/[...path]. They sign nothing and reach nothing.
      NEON_AUTH_BASE_URL: https://auth.invalid/ci
      NEON_AUTH_COOKIE_SECRET: ci-placeholder-value-that-signs-nothing-real

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e -- --project=chromium
